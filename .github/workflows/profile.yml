name: Draw the profile

on:
  schedule:
    - cron: "17 16 * * *"  # daily, 00:17 in Beijing
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.toml
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r scripts/requirements.txt

      - name: Draw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python scripts/generate.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets profile
          if git diff --cached --quiet; then
            echo "No change today."
            exit 0
          fi
          git commit -m "chore: redraw profile cards"
          git pull --rebase origin main
          git push origin HEAD:main
